# Bog'liqliklar haftalik, guruhlab yangilanadi (PR soni kam bo'lsin).
# npm (web, supabase CLI) yozuvlari E01/E02 da package.json paydo bo'lganda qo'shiladi.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
