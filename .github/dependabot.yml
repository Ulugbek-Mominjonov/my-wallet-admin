# Bog'liqliklar haftalik, guruhlab yangilanadi (PR soni kam bo'lsin).
# npm (web) yozuvi E02 da web/package.json paydo bo'lganda qo'shiladi.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      tooling:
        patterns: ["*"]
