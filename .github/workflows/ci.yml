name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # web build lokal manzil va joy egallovchi kalit bilan (backendga murojaat
  # yo'q); e2e job haqiqiy lokal kalitni `supabase status` dan oladi.
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
  VITE_APP_ENV: local
  # Telegram bot nomi — sir emas; ulash havolasi va QR shundan quriladi
  # (`make web-env` lokalda ham shu joy egallovchi nomni yozadi).
  VITE_TELEGRAM_BOT: MyWalletLocalBot

jobs:
  web:
    name: web — lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Format, ESLint, tiplar
        run: make web-lint
      - name: Unit/komponent testlari
        run: pnpm --filter @my-wallet/web test -- --coverage
      - name: Production build
        run: make web-build

  functions:
    name: functions — Deno lint, testlar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Format, lint, tiplar
        run: make fn-lint
      - name: Unit va snapshot testlari
        run: make fn-test

  db:
    name: db — migratsiyalar, lint, pgTAP, tiplar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Edge Functions lokal muhiti (faqat lokal/CI qiymatlari — haqiqiy sir emas).
      - name: Edge Functions muhiti
        run: cp supabase/functions/.env.example supabase/functions/.env
      - name: Lokal Supabase (keraksiz servislarsiz)
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor
      - name: Migratsiya xavfsizligi va SQL lint
        run: make db-lint
      - name: pgTAP testlari
        run: make db-test
      - name: Kontrakt testlari (golden fixture'lar)
        run: make contract-test
      - name: Sinxron — parallel yozuv va kursor
        run: make sync-test
      - name: Edge Functions — uchidan-uchiga (pg_cron yo'li bilan)
        run: make fn-smoke
      - name: Ishlash — hisobotlar vaqti va Seq Scan (docs/PERF.md)
        run: make perf
      - name: Generatsiya qilingan TS tiplari eskirmaganmi
        run: make db-types-check
      - name: Mobil bilan shartnoma (contracts/) eskirmaganmi
        run: make contracts-check

  e2e:
    name: e2e — Playwright
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # E21-T05: kirish va byudjetlar haqiqiy Auth/RPC bilan (email kodi — Mailpit).
      - name: Lokal Supabase (auth, rest, mailpit)
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,realtime
      - name: Chromium
        run: pnpm --filter @my-wallet/web exec playwright install --with-deps chromium
      - name: E2E (desktop + mobil)
        # Lokal publishable kalit (sir emas) — build va test yordamchilari uchun.
        run: |
          VITE_SUPABASE_PUBLISHABLE_KEY="$(pnpm exec supabase status -o env \
            | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"/\1/p')" make web-e2e
      - name: Hisobot (xato bo'lsa)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
