name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Karkas bosqichida web build/e2e backendga murojaat qilmaydi — lokal
  # manzil va joy egallovchi kalit yetarli (haqiqiy kalit shart emas).
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
  VITE_APP_ENV: local

jobs:
  web:
    name: web — lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Format, ESLint, tiplar
        run: make web-lint
      - name: Unit/komponent testlari
        run: pnpm --filter @my-wallet/web test -- --coverage
      - name: Production build
        run: make web-build

  db:
    name: db — migratsiyalar, lint, pgTAP, tiplar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Lokal Supabase (keraksiz servislarsiz)
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Migratsiya xavfsizligi va SQL lint
        run: make db-lint
      - name: pgTAP testlari
        run: make db-test
      - name: Generatsiya qilingan TS tiplari eskirmaganmi
        run: make db-types-check

  e2e:
    name: e2e — Playwright
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Chromium
        run: pnpm --filter @my-wallet/web exec playwright install --with-deps chromium
      - name: E2E (desktop + mobil)
        run: make web-e2e
      - name: Hisobot (xato bo'lsa)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
