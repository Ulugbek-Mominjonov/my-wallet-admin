# Har PR uchun admin panelning preview versiyasi (staging backend bilan —
# preview hech qachon prod ma'lumotiga ulanmaydi). Havola PR izohida.
name: Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork'dan kelgan PR'larga sirlar berilmaydi — ular uchun o'tkaziladi.
    if: vars.DEPLOY_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL_STAGING }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY_STAGING }}
      VITE_APP_ENV: staging
      VITE_TELEGRAM_BOT: ${{ vars.TELEGRAM_BOT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make web-build

      - name: Preview versiyasini yuklash
        id: upload
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          output="$(pnpm exec wrangler versions upload --env staging --preview-alias "$ALIAS" 2>&1)"
          echo "$output"
          url="$(grep -oE "https://${ALIAS}-[^ ]+\.workers\.dev" <<< "$output" | head -1)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: PR izohi
        if: steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          body="🔎 **Preview:** ${URL} (staging backend, commit ${GITHUB_SHA::7})"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"
