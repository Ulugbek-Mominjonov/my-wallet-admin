# Qayta ishlatiladigan deploy: bitta muhitga (staging | production)
# migratsiyalar → Edge Functions → admin panel → smoke test.
# Chaqiruvchilar: deploy.yml (main / qo'lda) va release.yml (teg).
name: Deploy (muhit)

on:
  workflow_call:
    inputs:
      environment:
        description: staging | production
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: deploy — ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment sirlari (DB paroli va h.k.) shu yerdan olinadi;
    # production — reviewer tasdig'idan keyingina ishlaydi (DEPLOY.md 1-bo'lim).
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      IS_PROD: ${{ inputs.environment == 'production' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ inputs.environment == 'production' && vars.SUPABASE_PROJECT_REF_PRODUCTION || vars.SUPABASE_PROJECT_REF_STAGING }}
      VITE_SUPABASE_URL: ${{ inputs.environment == 'production' && vars.SUPABASE_URL_PRODUCTION || vars.SUPABASE_URL_STAGING }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.environment == 'production' && vars.SUPABASE_PUBLISHABLE_KEY_PRODUCTION || vars.SUPABASE_PUBLISHABLE_KEY_STAGING }}
      VITE_APP_ENV: ${{ inputs.environment }}
      ADMIN_URL: ${{ inputs.environment == 'production' && vars.ADMIN_URL_PRODUCTION || vars.ADMIN_URL_STAGING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Supabase loyihasiga ulanish
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migratsiyalar
        run: pnpm exec supabase db push

      - name: Edge Functions
        run: |
          if compgen -G "supabase/functions/*/index.ts" > /dev/null; then
            pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "Edge Functions hali yo'q (E11) — o'tkazildi"
          fi

      - name: Admin panel build
        run: make web-build

      - name: Admin panel deploy (Cloudflare)
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ "$IS_PROD" = "true" ]; then
            pnpm exec wrangler deploy
          else
            pnpm exec wrangler deploy --env staging
          fi

      - name: Smoke — backend javob beradi
        run: |
          curl -fsS --max-time 10 -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/health" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" -H "content-type: application/json" -d '{}'

      - name: Smoke — admin panel (Playwright)
        env:
          E2E_BASE_URL: ${{ env.ADMIN_URL }}
        run: |
          pnpm --filter @my-wallet/web exec playwright install --with-deps chromium
          pnpm --filter @my-wallet/web exec playwright test --project desktop
