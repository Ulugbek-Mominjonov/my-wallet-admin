# release-please: Conventional Commits asosida reliz PR'i (CHANGELOG + versiya).
# PR merge qilinganda teg yaratiladi va production deploy boshlanadi
# (production Environment'da reviewer tasdig'i bilan).
#
# Eslatma: GITHUB_TOKEN bilan yaratilgan teg boshqa workflow'ni ishga
# tushirmaydi — shuning uchun deploy shu yerdan to'g'ridan-to'g'ri chaqiriladi.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Reliz PR'i uchun "Allow GitHub Actions to create ... pull requests"
    # sozlamasi kerak (DEPLOY.md 1-bo'lim) — deploy bilan birga yoqiladi.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-production:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
    secrets: inherit
