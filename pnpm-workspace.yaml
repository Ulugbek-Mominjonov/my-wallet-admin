packages:
  - web

# Faqat shu paketlarga o'rnatish skriptlarini ishga tushirishga ruxsat
# (pnpm standart holatda bloklaydi — ta'minot zanjiri xavfsizligi).
allowBuilds:
  unrs-resolver: true
  # wrangler: Cloudflare lokal runtime (workerd) va bundler (esbuild) binarlari
  esbuild: true
  workerd: true
  # msw: postinstall faqat brauzer service worker'ini nusxalaydi — testlar msw/node
  msw: false

peerDependencyRules:
  allowedVersions:
    # jsx-a11y 6.10 ESLint 10 ni peer sifatida hali e'lon qilmagan, lekin
    # flat config bilan to'liq ishlaydi (make web-lint yashil). Plagin
    # yangilanganda bu qoida olib tashlanadi.
    eslint-plugin-jsx-a11y>eslint: '10'
